# Local development composition.
#
# SODAK-TECH-DESIGN.md §5.3 is explicit that this shape is for evaluation only:
# "The upstream single-host composition is suitable for local evaluation only.
# Production requires decomposition: managed database, managed cache, managed
# queue, and judge workers relocated to a dedicated, network-isolated pool."
#
# Note what is deliberately absent: there is no judge worker service here. A
# judge worker needs kernel-level control (§5.1) and must sit in a network zone
# with no route to this database (§3.1). Running one alongside Postgres on a
# developer laptop would model the exact topology the design forbids.

# The project name is distinct from the SODAK_Solve stack this backend was
# ported from. Both declared `sodak-backend`, which meant they shared
# containers and, more dangerously, the same pgdata volume -- `compose down -v`
# in one wiped the other.
name: sodak-tech

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: sodak
      POSTGRES_PASSWORD: sodak
      POSTGRES_DB: sodak
    ports:
      # High host port deliberately: 5432 is taken by a locally installed
      # Postgres on this machine, 5433 by another stack's Traefik, and 55432 by
      # the SODAK_Solve stack. Nothing inside the compose network uses this
      # mapping -- it exists only so you can point psql or a GUI client at the
      # container.
      - "55433:5432"
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # so `pg_upgrade --link` can work across a single mount point. Mounting
      # at /var/lib/postgresql/data instead makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sodak -d sodak"]
      interval: 5s
      timeout: 3s
      retries: 10
    # §4.7: every container declares limits. An unlimited container that leaks
    # consumes its node and takes down everything on it.
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:8-bookworm
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      # 6379 belongs to the SODAK_Solve stack; nothing inside this network uses
      # the published port.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384m

  # Transaction-mode pooling in front of Postgres. §4.3 calls this mandatory,
  # not an optimisation: without it, replicas x workers exceeds the connection
  # limit and every request fails -- including health checks, which triggers a
  # restart storm.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: db
      DB_USER: sodak
      DB_PASSWORD: sodak
      DB_NAME: sodak
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6433:5432"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    command: >
      python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Through the pooler, so local development exercises the same path as
      # production rather than discovering pooling problems at deploy time.
      DATABASE_URL: postgres://sodak:sodak@pgbouncer:5432/sodak
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    env_file:
      - .env
    ports:
      # 8000 is held by a local splunkd on this machine, and Docker Desktop
      # drops the binding silently rather than failing the container. The Vite
      # dev server proxies /api and /healthz here, so nothing hardcodes it.
      - "8081:8000"
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  # One-shot migration runner.
  #
  # Points at `db` directly, NOT at pgbouncer. Transaction-mode pooling returns
  # a different backend connection per transaction, which breaks the session
  # state DDL relies on -- migrations acquire locks and run multi-statement
  # transactions that must stay on one backend. §5.3 also wants migrations run
  # "under a separate role, in a separate step"; wire that role in here when the
  # managed database is provisioned.
  #
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: runtime
    command: python manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sodak:sodak@db:5432/sodak
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Test runner.
  #
  #   docker compose run --rm test
  #   docker compose run --rm test pytest apps/administration -q
  #
  # Points at `db` directly for the same reason `migrate` does: pytest-django
  # creates and drops the test database, which is DDL and cannot run through a
  # transaction-mode pooler.
  test:
    build:
      context: .
      target: test
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sodak:sodak@db:5432/sodak
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Argon2 is deliberately slow. Every test that logs a user in pays for it,
      # which is the difference between a suite you run and one you skip.
      USE_FAST_HASHING: "true"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # The sandbox image. Build-only: nothing long-running uses it, because a
  # container is created from it per submission and destroyed afterwards.
  #
  #   docker compose --profile build-only build judge-sandbox
  #
  # Declared here so the tag stays in step with JUDGE_SANDBOX_IMAGE rather than
  # being built by hand and drifting.
  judge-sandbox:
    build:
      context: ./judge
    image: sodak-judge-sandbox:latest
    profiles: ["build-only"]
    # Never run as a service. The dispatcher creates containers from this image
    # with networking disabled, capabilities dropped and cgroup ceilings set; a
    # long-running instance would have none of that applied.
    command: ["true"]

  # Dispatches judge jobs and handles background work.
  #
  # This is Zone 2, not a sandbox: it holds database credentials and the
  # container runtime socket, and it runs no submitted code. It creates a
  # throwaway container that does, then reads back what that container printed
  # and compares it against expected output the container never saw.
  #
  # §5.4 requires the runtime socket stay out of reach of anything running
  # untrusted code. That is why the boundary is drawn here: the process with
  # the socket never executes a submission, and the process that executes a
  # submission has no socket.
  worker:
    build:
      context: .
      target: runtime
    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=2
      --queues=judge.practice,judge.contest
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sodak:sodak@pgbouncer:5432/sodak
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      JUDGE_SANDBOX_IMAGE: sodak-judge-sandbox:latest
      JUDGE_DOCKER_HOST: unix:///var/run/docker.sock
    env_file:
      - .env
    volumes:
      - .:/app
      # Equivalent to host root. Mounted into this service and nowhere else,
      # and never into the sandbox image.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is owned by root:docker on the host and the application image
    # runs as uid 10001, which is not in that group. So the dispatcher runs as
    # root in *this* container to open it -- while the container it creates for
    # the submission runs as uid 65532 with every capability dropped and no
    # socket. Privilege sits with the code that is trusted, not the code that
    # is judged.
    user: root
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    # §4.5: a worker terminated mid-job must release it back to the queue
    # rather than leave a submission pending forever.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  pgdata:
