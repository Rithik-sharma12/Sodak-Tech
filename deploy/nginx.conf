# Sodak-Tech production nginx site.
#
# One origin for everything, which is what session-cookie auth requires: the
# browser sees the same host for the app, the API, and Django's admin, so there
# is no CORS, no SameSite edge case, and the CSRF cookie the API sets is
# readable without special-casing a port.
#
# Topology (see docs/DEPLOYMENT.md):
#   frontend/  -> node .output/server/index.mjs  (nitro node-server build, :3000)
#   backend/   -> gunicorn config.wsgi:application (:8000)
#   browser    -> nginx :443
#
# Install to /etc/nginx/sites-available/sodak and symlink into sites-enabled,
# or place it under /etc/nginx/conf.d/. Do not serve the SSR output directly to
# the internet: nginx owns TLS, the security headers, and the backend routing.

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME (certbot) challenge. Remove or tighten once certificates exist.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Replace with the deployed domain and certificate path. Certbot's
    # --webroot challenge against the redirect block above works as-is.
    server_name judge.example.edu;
    ssl_certificate     /etc/letsencrypt/live/judge.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judge.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The API sets HttpOnly cookies and Django's prod settings require HTTPS
    # (SECURE_SSL_REDIRECT, SECURE_COOKIE). Stripping this header is the single
    # most common way a judge deployment breaks silently: leave it on.
    proxy_set_header X-Forwarded-Proto https;

    # ------------------------------------------------------------------
    # Backend-owned paths
    # ------------------------------------------------------------------

    # REST API. proxy_pass with no URI preserves /api/v1/... untouched.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # judging can outlast the default 60s
    }

    # Liveness/readiness probes (design doc §4.4) — deliberately outside /api
    # so an orchestrator can distinguish an unreachable Django from a broken
    # judge response, and so nginx ACLs can permit them separately.
    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django's own admin, reachable for the operations the custom panel is not
    # good at — inspecting a row, resetting a password. Must NOT be exposed to
    # the general internet; restrict the source range.
    #   allow 192.0.2.0/24;      # replace with your office/VPN range
    #   deny all;
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django static assets (admin stylesheets, etc.).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # Frontend (SSR + client assets), everything else
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Websocket upgrade for HMR/dev tooling and any future live verdicts.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Shared hardening
    # ------------------------------------------------------------------
    client_max_body_size 20m;

    # Content-Security-Policy is deliberately absent: the platform renders
    # learner code and a wrong policy here would break the judge demo before
    # it protects anyone. Revisit it with the sandboxing work in §4 of
    # docs/DEVELOPMENT-PLAN.md.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
