version: "3"
services:

  oj-redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: always
    volumes:
      - ./data-volumes/redis:/data

  oj-postgres:
    image: postgres:16-alpine
    container_name: oj-postgres
    restart: always
    volumes:
      - ./data-volumes/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=onlinejudge

  oj-judge:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:latest
    container_name: oj-judge
    restart: always
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - ./data-volumes/backend/test_case:/test_case:ro
      - ./data-volumes/judge_server/log:/log
      - ./data-volumes/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judge:8080
      - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
      - TOKEN=${JUDGE_SERVER_TOKEN:-CHANGE_THIS}

  oj-backend:
    build: .
    container_name: oj-backend
    restart: always
    depends_on:
      - oj-redis
      - oj-postgres
      - oj-judge
    volumes:
      - ./data-volumes/backend:/data
    environment:
      - OJ_ENV=production
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=onlinejudge
      - POSTGRES_HOST=oj-postgres
      - REDIS_HOST=oj-redis
      - JUDGE_SERVER_TOKEN=${JUDGE_SERVER_TOKEN:-CHANGE_THIS}
      # - FORCE_HTTPS=1
      # - STATIC_CDN_HOST=cdn.example.com
    ports:
      - "0.0.0.0:80:8000"
      - "0.0.0.0:443:1443"
